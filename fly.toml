# Fly.io deployment for the HTTP transport.
#
#   fly launch --no-deploy --copy-config --name selver-mcp
#   fly secrets set SELVER_MCP_TOKEN="$(openssl rand -hex 32)"
#   fly deploy
#
# Any container host works; this one is here because it is the least setup for
# a single stateless container that needs one secret.

app = "selver-mcp"
primary_region = "arn"   # Stockholm — nearest Fly region to Estonia

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # The server is stateless by design: it holds no cart, no session, nothing
  # between requests. So scaling to zero costs nothing but a cold start — there
  # is no state to lose. A grocery endpoint used a few times a week should not
  # be billed as if it were always awake.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"          # unauthenticated, reveals nothing
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
